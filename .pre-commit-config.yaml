exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "easy_pos.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                easy_pos/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                easy_pos/templates/includes/.*|
                easy_pos/public/js/lib/.*
            )$


  - repo: local
    hooks:
      - id: eslint
        name: "Run eslint (posapp, via its own local ESLint 9 install)"
        description: "Runs posapp's own installed ESLint (flat config + eslint-plugin-react-hooks@^7) instead of pre-commit mirrors-eslint's pinned ESLint 8, which can't resolve rules from an ESLint-9-targeted plugin. Requires `cd posapp && yarn install`."
        entry: ./.github/helper/eslint.sh
        language: script
        types_or: [javascript, jsx]
        files: "^posapp/"
        # Ignore built/bundled output, never hand-authored source.
        exclude: |
            (?x)^(
                posapp/public/dist/.*|
                .*node_modules.*|
                easy_pos/public/posapp/.*
            )$
        pass_filenames: true

  - repo: local
    hooks:
      - id: frappe-semgrep-rules
        name: "Run Frappe Semgrep rules (correctness)"
        description: "Mirrors .github/workflows/linter.yml's Semgrep step (frappe/semgrep-rules + r/python.lang.correctness) locally. Requires `pip install semgrep`."
        entry: ./.github/helper/semgrep.sh
        language: script
        files: "\\.py$"
        exclude: ".*node_modules.*"
        pass_filenames: true
        # Forces a single invocation instead of pre-commit's default parallel
        # file-batching — the script clones/updates a shared rules cache dir
        # on first run, and two parallel invocations both seeing it missing
        # race each other's `git clone` into the same path ("destination
        # path ... already exists and is not an empty directory").
        require_serial: true

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
